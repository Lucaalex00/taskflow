# Every value below is overridable from a .env file next to this one (copy .env.example),
# or from the environment. The `${VAR:-default}` defaults mean `docker compose up --build`
# still works with no .env at all — the demo stays one command, but nothing is hardcoded.
services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
    # Published only so you can inspect the database with your own client. If port 5432 is
    # already taken by a local Postgres, set POSTGRES_PORT to something else in .env —
    # nothing inside the stack depends on the host port.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-1.0}"
          memory: ${POSTGRES_MEMORY:-512M}

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: taskflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-taskflow};Username=${POSTGRES_USER:-taskflow};Password=${POSTGRES_PASSWORD:-taskflow}"
      # Signing key for issued JWTs. The default is a well-known demo value and the API
      # refuses to start with it when ASPNETCORE_ENVIRONMENT=Production — set JWT_SECRET
      # (32+ chars) in .env before deploying anywhere real.
      Jwt__Secret: ${JWT_SECRET:-dev-only-secret-change-me-in-any-real-deployment-32chars+}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-1440}
      # How often the workload monitor snapshots every board and evaluates alert rules.
      # Lower it (e.g. 10) to watch anomaly alerts fire while you're exploring.
      LoadMonitor__IntervalSeconds: ${LOAD_MONITOR_INTERVAL_SECONDS:-20}
      RateLimiting__Auth__PermitLimit: ${AUTH_RATE_LIMIT_PERMITS:-10}
      RateLimiting__Auth__WindowSeconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Seeds a ready-to-explore demo workspace (two users, a populated board, and task load
      # that trips a real anomaly alert) on an empty database. Set to false for a blank start.
      Seed__Enabled: ${SEED_DEMO:-true}
      Seed__Password: ${SEED_PASSWORD:-Demo-password-2026}
      # Wipes and re-seeds the demo workspace once it's older than this, so a demo you show
      # people keeps looking the way it's meant to without anyone remembering to reset it.
      # Set to 0 to switch the reset off and keep whatever you create.
      Seed__ResetIntervalHours: ${SEED_RESET_INTERVAL_HOURS:-168}
    ports:
      - "${API_PORT:-5080}:8080"
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: ${API_MEMORY:-512M}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: taskflow-frontend
    restart: unless-stopped
    # Waits for the API's own container healthcheck (see Dockerfile.api) rather than just for
    # the container to exist, so nginx never proxies to a backend that's still migrating.
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Where nginx proxies /api and /hubs. The default is the API service on this compose
      # network; a hosting platform needs its own internal address (see docs/deploying.md).
      API_UPSTREAM: ${API_UPSTREAM:-api:8080}
    ports:
      # No fixed host port: Docker picks whichever is free so this never collides with
      # another project already listening on a hardcoded port. Find it with
      # `docker compose port frontend 8080`, or pin one yourself with WEB_PORT in .env.
      - "${WEB_PORT:-}:8080"
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPUS:-0.5}"
          memory: ${WEB_MEMORY:-128M}

volumes:
  postgres-data:
