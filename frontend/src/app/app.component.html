<div class="shell">
  <header class="shell__header">
    <a routerLink="/" class="brand">
      <span class="brand__pulse" aria-hidden="true"></span>
      <span class="brand__name">TASKFLOW</span>
      <span class="brand__tag">workload console</span>
    </a>

    <div class="shell__header-actions">
      <app-docs-panel />
      <app-theme-toggle />
      @if (currentUser.isAuthenticated()) {
        <app-notification-bell />
        <app-user-menu />
      }
    </div>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>

<app-toast-container />
