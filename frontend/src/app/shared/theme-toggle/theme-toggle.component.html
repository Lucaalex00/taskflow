<button
  class="theme-toggle"
  type="button"
  (click)="toggle()"
  [title]="label()"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="isDark()"
>
  @if (isDark()) {
    <!-- Sun: clicking it takes you to the light theme -->
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round" />
    </svg>
  } @else {
    <!-- Moon: clicking it takes you back to the dark console -->
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z" stroke-linejoin="round" />
    </svg>
  }
</button>
