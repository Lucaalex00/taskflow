name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/UnitTests/TaskFlow.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=unit-tests.trx"

      # Integration tests spin up their own Testcontainers Postgres instance,
      # independent of the "postgres" service above (which only backs the API
      # container during local docker-compose runs). Docker-in-Docker is
      # available by default on GitHub-hosted runners.
      - name: Integration tests
        run: dotnet test tests/IntegrationTests/TaskFlow.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=integration-tests.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx ng lint

      - name: Unit tests (headless)
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build (production)
        working-directory: frontend
        run: npx ng build --configuration production

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      # docker-compose.e2e.yml only relaxes the login/register rate limit (see the file for
      # why) — everything else runs exactly as the README's `docker compose up --build` does.
      - name: Build & start the full stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5080/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "API never became healthy" >&2
          docker compose logs
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Publish Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  docker:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR (like all Docker registries) requires lowercase image references, but
      # github.repository preserves the owner's display case (e.g. "Lucaalex00/taskflow"),
      # which docker/build-push-action rejects with "invalid reference format".
      - name: Compute lowercase image name
        id: image
        run: echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/api:latest
            ghcr.io/${{ steps.image.outputs.repository }}/api:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/frontend:latest
            ghcr.io/${{ steps.image.outputs.repository }}/frontend:${{ github.sha }}

      # Scans each published image for HIGH/CRITICAL CVEs (OS packages + .NET/npm
      # dependencies). Prints a readable table to the job log and saves it as a build
      # artifact — deliberately NOT uploaded to the Security tab, so it needs no
      # security-events permission or code-scanning setup. Non-blocking (exit-code 0): a demo
      # shouldn't go red over a CVE in an upstream base image nobody's shipped a fix for yet,
      # but it should stay visible. (Note the required "v" prefix on the action version — a
      # bare "0.29.0" doesn't resolve and fails the whole job at "Set up job".)
      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: ghcr.io/${{ steps.image.outputs.repository }}/api:${{ github.sha }}
          format: table
          output: trivy-api.txt
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: ghcr.io/${{ steps.image.outputs.repository }}/frontend:${{ github.sha }}
          format: table
          output: trivy-frontend.txt
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Show scan results in the log
        if: always()
        run: |
          echo "::group::Trivy — API image"; cat trivy-api.txt || true; echo "::endgroup::"
          echo "::group::Trivy — frontend image"; cat trivy-frontend.txt || true; echo "::endgroup::"

      - name: Upload vulnerability scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*.txt
          retention-days: 7
